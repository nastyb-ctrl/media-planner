<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  />

  <meta name="theme-color" content="#f7f7f5" />

  <title>Media Planner</title>

  <link rel="stylesheet" href="styles.css?v=final-10" />
</head>

<body>
  <div id="app" class="app">

    <!-- AUTH / LOADING -->
    <section id="authScreen" class="auth-screen">
      <div class="auth-card">
        <div class="auth-logo">MP</div>
        <h1>Media Planner</h1>
        <p id="authStatus">Загрузка…</p>
      </div>
    </section>

    <!-- MAIN APP -->
    <main id="mainScreen" class="main-screen hidden">

      <!-- CALENDAR -->
      <section id="calendarView" class="view active">

        <div class="page-head calendar-head">
          <div>
            <h1>Календарь</h1>
            <div id="currentMonth" class="month-label"></div>
          </div>

          <div class="calendar-actions">
            <button
              id="addContentTop"
              class="icon-button"
              type="button"
              aria-label="Добавить контент"
            >
              +
            </button>

            <button
              id="prevMonth"
              class="icon-button"
              type="button"
              aria-label="Предыдущий месяц"
            >
              ‹
            </button>

            <button
              id="todayBtn"
              class="small-button"
              type="button"
            >
              Сегодня
            </button>

            <button
              id="nextMonth"
              class="icon-button"
              type="button"
              aria-label="Следующий месяц"
            >
              ›
            </button>
          </div>
        </div>

        <div class="calendar-wrapper">
          <div class="calendar-weekdays">
            <div>Пн</div>
            <div>Вт</div>
            <div>Ср</div>
            <div>Чт</div>
            <div>Пт</div>
            <div>Сб</div>
            <div>Вс</div>
          </div>

          <div id="calendarGrid" class="calendar-grid"></div>
        </div>

        <div class="section-head">
          <h2>Ближайшие публикации</h2>
        </div>

        <div id="upcomingList" class="upcoming-list"></div>

      </section>


      <!-- CONTENT -->
      <section id="contentView" class="view hidden">

        <div class="page-head">
          <div>
            <h1>Контент</h1>
            <div class="page-subtitle">Все публикации команды</div>
          </div>

          <button
            id="addContentBtn"
            class="primary-button"
            type="button"
          >
            + Контент
          </button>
        </div>

        <div class="content-filters">

          <div class="search-wrap">
            <input
              id="contentSearch"
              type="search"
              placeholder="Поиск контента"
              autocomplete="off"
            />
          </div>

          <select id="platformFilter">
            <option value="all">Все площадки</option>
            <option value="telegram">Telegram</option>
            <option value="vk">VK</option>
            <option value="instagram">Instagram</option>
            <option value="youtube">YouTube</option>
            <option value="tiktok">TikTok</option>
            <option value="other">Другое</option>
          </select>

        </div>

        <div id="contentList" class="content-list"></div>

      </section>


      <!-- TEAM -->
      <section id="teamView" class="view hidden">

        <div class="page-head">
          <div>
            <h1>Команда</h1>
            <div class="page-subtitle">
              Все участники проекта
            </div>
          </div>
        </div>

        <div id="teamList" class="team-list"></div>

      </section>


      <!-- ANALYTICS -->
      <section id="analyticsView" class="view hidden">

        <div class="page-head">
          <div>
            <h1>Аналитика</h1>
            <div class="page-subtitle">
              Публикации и нагрузка команды
            </div>
          </div>
        </div>

        <div class="analytics-filters">

          <select id="analyticsPeriod">
            <option value="week">Неделя</option>
            <option value="month" selected>Месяц</option>
            <option value="3months">3 месяца</option>
            <option value="all">Всё время</option>
          </select>

          <select id="analyticsPlatform">
            <option value="all">Все площадки</option>
            <option value="telegram">Telegram</option>
            <option value="vk">VK</option>
            <option value="instagram">Instagram</option>
            <option value="youtube">YouTube</option>
            <option value="tiktok">TikTok</option>
            <option value="other">Другое</option>
          </select>

        </div>

        <div id="analyticsSummary" class="analytics-summary"></div>

        <div id="analyticsCharts" class="analytics-charts"></div>

      </section>


      <!-- BOTTOM NAVIGATION -->
      <nav class="bottom-nav">

        <button
          class="nav-button active"
          data-view="calendarView"
          type="button"
        >
          <span class="nav-icon">▦</span>
          <span>Календарь</span>
        </button>

        <button
          class="nav-button"
          data-view="contentView"
          type="button"
        >
          <span class="nav-icon">□</span>
          <span>Контент</span>
        </button>

        <button
          class="nav-button"
          data-view="teamView"
          type="button"
        >
          <span class="nav-icon">○</span>
          <span>Команда</span>
        </button>

        <button
          class="nav-button"
          data-view="analyticsView"
          type="button"
        >
          <span class="nav-icon">↗</span>
          <span>Аналитика</span>
        </button>

      </nav>

    </main>
  </div>


  <!-- DAY DETAILS MODAL -->
  <div id="dayModal" class="modal hidden">

    <div class="modal-backdrop" data-close-day-modal></div>

    <div class="modal-sheet day-sheet">

      <div class="modal-head">
        <div>
          <div id="dayModalDate" class="modal-title">
            Публикации
          </div>
        </div>

        <button
          id="closeDayModal"
          class="modal-close"
          type="button"
        >
          ×
        </button>
      </div>

      <div id="dayPublications" class="day-publications"></div>

      <button
        id="addPublicationForDay"
        class="primary-button full-width"
        type="button"
      >
        + Добавить публикацию
      </button>

    </div>
  </div>


  <!-- CONTENT EDITOR MODAL -->
  <div id="contentModal" class="modal hidden">

    <div class="modal-backdrop" data-close-content-modal></div>

    <div class="modal-sheet content-sheet">

      <div class="modal-head">
        <div>
          <div id="modalTitle" class="modal-title">
            Новый контент
          </div>
        </div>

        <button
          id="closeModal"
          class="modal-close"
          type="button"
        >
          ×
        </button>
      </div>


      <form id="contentForm" class="content-form">

        <input
          id="contentId"
          type="hidden"
        />

        <div class="field">
          <label for="contentTitle">
            Название контента
          </label>

          <input
            id="contentTitle"
            type="text"
            placeholder="Например: Пост про новый курс"
            required
          />
        </div>


        <div class="field">
          <label for="contentDescription">
            Описание
          </label>

          <textarea
            id="contentDescription"
            rows="3"
            placeholder="Короткое описание контента"
          ></textarea>
        </div>


        <div class="publications-head">
          <div>
            <h3>Публикации</h3>
            <p>
              Один контент может публиковаться несколько раз
            </p>
          </div>

          <button
            id="addPublicationBtn"
            class="secondary-button"
            type="button"
          >
            + Публикация
          </button>
        </div>


        <div id="publicationTemplates" class="publication-templates"></div>


        <div class="form-actions">

          <button
            id="deleteContentBtn"
            class="danger-button hidden"
            type="button"
          >
            Удалить
          </button>

          <button
            id="cancelModal"
            class="secondary-button"
            type="button"
          >
            Отмена
          </button>

          <button
            id="saveContentBtn"
            class="primary-button"
            type="submit"
          >
            Сохранить
          </button>

        </div>

      </form>

    </div>
  </div>


  <!-- TELEGRAM -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- APP -->
  <script src="app.js?v=final-10"></script>

</body>
</html>
